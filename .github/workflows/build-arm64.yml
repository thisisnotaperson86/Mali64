name: Build Mali64 (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (Emulação ARM64)
      uses: docker/setup-qemu-action@v3

    - name: Build inside Ubuntu ARM64 Container
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          arm64v8/ubuntu:22.04 \
          /bin/bash -c "
            apt-get update && \
            apt-get install -y build-essential cmake ninja-build git libsdl2-dev libgles2-mesa-dev && \
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && \
            cmake --build build -j \$(nproc)
          "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mali64-Game-ARM64
        path: build/Mali64_Game
        if-no-files-found: warn
